name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # -race is the point of this step: the matching engine's concurrency
      # tests exercise parallel buys and sells against a shared balance, and
      # the race detector fails the build on any unsynchronised access.
      - name: Test with race detector
        run: go test ./... -race -count=1

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Only deploy from main, and only if the build and tests passed.
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # The docker build produces no output for long stretches while Go
      # compiles, which can look like an idle connection and get dropped.
      # ServerAliveInterval sends a keepalive every 30s to prevent that.
      - name: Pull and rebuild on droplet
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             cd /root/TradeGo
             git fetch --all
             git reset --hard origin/main
             docker compose --env-file .env -f deployments/docker-compose.yml up -d --build
             docker image prune -f'

      - name: Verify the service is healthy
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             for i in $(seq 1 20); do
               if curl -fsS http://localhost:8080/health > /dev/null; then
                 echo "Backend healthy after ${i} attempt(s)."
                 exit 0
               fi
               echo "Waiting for backend... (${i}/20)"
               sleep 3
             done
             echo "Backend did not become healthy. Recent logs:"
             docker compose --env-file .env -f deployments/docker-compose.yml logs backend --tail=50
             exit 1'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key