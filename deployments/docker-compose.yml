version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: tradego-db
    environment:
      POSTGRES_USER: tradego
      POSTGRES_PASSWORD: tradego123
      POSTGRES_DB: tradego
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata: