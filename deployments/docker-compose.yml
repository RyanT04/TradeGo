services:
  postgres:
    image: postgres:15
    container_name: tradego-db
    environment:
      POSTGRES_USER: tradego
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tradego
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradego"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tradego-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://tradego:${POSTGRES_PASSWORD}@postgres:5432/tradego?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      BASE_URL: ${BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env

volumes:
  pgdata: